<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>แสดงรายการอาหาร (Admin)</title>
  <style>
    :root{--green:#00C700;--muted:#f6f6f6}
    body{font-family:Arial,Helvetica,sans-serif;margin:0;background:#fff;color:#222}
    .top{display:flex;align-items:center;padding:12px 16px;border-bottom:1px solid #eee}
    .back{color:var(--green);text-decoration:none;font-weight:700;font-size:22px;margin-right:8px}
    .title{color:var(--green);font-weight:700;font-size:18px}
    .container{padding:16px}
    .item{padding:12px;border-radius:8px;border:1px solid #eee;margin-bottom:10px;background:#fafafa}
    .item h4{margin:0 0 6px 0;color:var(--green)}
    .btn{padding:8px 10px;border-radius:6px;border:none;background:var(--green);color:#fff}
  </style>
</head>
<body>
  <div class="top">
    <a href="admin.html" class="back">‹</a>
    <div class="title">แสดงรายการอาหาร</div>
  </div>
  <div class="container">
    <div id="list"></div>
    <div style="margin-top:12px"><button onclick="location.href='admin_menu_food.html'" class="btn">เพิ่มเมนูใหม่</button></div>
  </div>
  <script>
    function render(){
      const arr = JSON.parse(localStorage.getItem('admin_menu_entries')||'[]');
      const list = document.getElementById('list'); list.innerHTML='';
      if(arr.length===0){ list.textContent='ยังไม่มีเมนูอาหาร'; return; }
      arr.forEach((it,i)=>{
        const el = document.createElement('div'); el.className='item';
        const h = document.createElement('h4'); h.textContent = it.menu || ('เมนู #' + (i+1)); el.appendChild(h);
        const p = document.createElement('div'); p.textContent = 'หมวด: ' + (it.category||'—') + ' • ประเภท: ' + (it.type||'—'); el.appendChild(p);
        const del = document.createElement('button'); del.className='btn'; del.style.background='#e53935'; del.textContent='ลบ'; del.addEventListener('click', ()=>{ if(!confirm('ลบเมนูนี้?')) return; arr.splice(i,1); localStorage.setItem('admin_menu_entries', JSON.stringify(arr)); render(); });
        el.appendChild(document.createElement('div')); el.appendChild(del);
        list.appendChild(el);
      });
    }
    render();
  </script>
</body>
</html>
