<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>กรอกข้อมูลส่วนตัว (Admin)</title>
  <style>
    :root{--green:#00C700;--muted:#f0f0f0}
    body{font-family:Arial,Helvetica,sans-serif;margin:0;background:#fff;color:#222}
    .top{display:flex;align-items:center;padding:12px 16px;border-bottom:1px solid #eee}
    .back{color:var(--green);text-decoration:none;font-weight:700;font-size:22px;margin-right:8px}
    .title{color:var(--green);font-weight:700;font-size:18px}
    .container{padding:16px}
    label{display:block;color:var(--green);font-weight:600;margin-top:10px}
    input, select{width:100%;padding:12px;border-radius:8px;border:none;background:var(--muted);box-sizing:border-box;margin-top:8px}
    .btn{margin-top:20px;background:var(--green);color:#fff;padding:12px;border:none;border-radius:6px;width:100%;font-weight:700}
  </style>
</head>
<body>
  <div class="top">
    <a href="admin_main.html" class="back">‹</a>
    <div class="title">ข้อมูลสมาชิก</div>
  </div>
  <div class="container">
    <div style="color:var(--green);font-weight:700;margin-bottom:12px">ตรวจสอบ</div>

    <div style="display:flex;align-items:center;gap:12px;margin-bottom:10px">
      <input id="member1" placeholder="ชื่อผู้ใช้นที่1" style="flex:1;padding:10px;border-radius:8px;border:1px solid #eee;background:var(--muted)">
      <button data-id="1" class="ok" title="อนุมัติ" style="background:var(--green);color:#fff;border-radius:6px;padding:8px 10px;border:none">✓</button>
      <button data-id="1" class="reject" title="ปฏิเสธ" style="background:#e53935;color:#fff;border-radius:6px;padding:8px 10px;border:none">✕</button>
    </div>

    <div style="display:flex;align-items:center;gap:12px;margin-bottom:10px">
      <input id="member2" placeholder="ชื่อผู้ใช้นที่2" style="flex:1;padding:10px;border-radius:8px;border:1px solid #eee;background:var(--muted)">
      <button data-id="2" class="ok" title="อนุมัติ" style="background:var(--green);color:#fff;border-radius:6px;padding:8px 10px;border:none">✓</button>
      <button data-id="2" class="reject" title="ปฏิเสธ" style="background:#e53935;color:#fff;border-radius:6px;padding:8px 10px;border:none">✕</button>
    </div>

    <div style="display:flex;align-items:center;gap:12px;margin-bottom:10px">
      <input id="member3" placeholder="ชื่อผู้ใช้นที่3" style="flex:1;padding:10px;border-radius:8px;border:1px solid #eee;background:var(--muted)">
      <button data-id="3" class="ok" title="อนุมัติ" style="background:var(--green);color:#fff;border-radius:6px;padding:8px 10px;border:none">✓</button>
      <button data-id="3" class="reject" title="ปฏิเสธ" style="background:#e53935;color:#fff;border-radius:6px;padding:8px 10px;border:none">✕</button>
    </div>

    <div style="margin-top:18px">
      <button class="btn" id="backBtn">กลับหน้าหลัก</button>
    </div>
  </div>
  <script src="check-admin.js"></script>
  <script>
    const key = 'member_checks_v1';
    function loadState(){ try{ return JSON.parse(localStorage.getItem(key)||'{}'); }catch(e){return{}} }
    function saveState(s){ localStorage.setItem(key, JSON.stringify(s)); }

    function applyState(){
      const s = loadState();
      [1,2,3].forEach(i=>{
        const ok = document.querySelector('button.ok[data-id="'+i+'"]');
        const rej = document.querySelector('button.reject[data-id="'+i+'"]');
        const input = document.getElementById('member'+i);
        if(s[i] && s[i].approved){ ok.style.opacity=1; rej.style.opacity=0.4; }
        else if(s[i] && s[i].rejected){ ok.style.opacity=0.4; rej.style.opacity=1; }
        else { ok.style.opacity=0.8; rej.style.opacity=0.8; }
        if(s[i] && s[i].name){ input.value = s[i].name; }
      });
    }

    document.querySelectorAll('button.ok').forEach(b=> b.addEventListener('click', ()=>{
      const id = b.getAttribute('data-id'); const s = loadState(); s[id] = s[id]||{}; s[id].approved = true; s[id].rejected = false; s[id].name = document.getElementById('member'+id).value; saveState(s); applyState();
    }));
    document.querySelectorAll('button.reject').forEach(b=> b.addEventListener('click', ()=>{
      const id = b.getAttribute('data-id'); const s = loadState(); s[id] = s[id]||{}; s[id].rejected = true; s[id].approved = false; s[id].name = document.getElementById('member'+id).value; saveState(s); applyState();
    }));

    document.getElementById('backBtn').addEventListener('click', ()=>{ window.location.href='admin_main.html'; });

    // apply initial state on load
    applyState();
  </script>
</body>
</html>
