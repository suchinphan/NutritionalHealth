<!doctype html>
<html lang="th">
<head>
  <meta charset="utf-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Admin</title>
  <style>
    :root{--green:#00C700;--muted:#f0f0f0}
    body{font-family:Arial,Helvetica,sans-serif;margin:0;background:#fff;color:#222}
    .wrap{max-width:1000px;margin:18px auto;padding:12px}
    /* login */
    .login-card{max-width:420px;margin:36px auto;padding:18px;border-radius:10px;background:#fafafa;border:1px solid #eee}
    .login-card h2{color:var(--green);margin:0 0 12px}
    .input{display:block;width:100%;padding:12px;border-radius:8px;border:1px solid #e6e6e6;margin-bottom:10px}
    .row{display:flex;align-items:center;gap:8px}
    .btn{padding:10px 14px;border-radius:8px;border:none;background:var(--green);color:#fff;cursor:pointer}
    .link{color:var(--green);text-decoration:none}

    /* main admin */
    .top{display:flex;align-items:center;justify-content:space-between;padding:12px 16px;border-bottom:1px solid #eee}
    .search{flex:1;margin:0 12px}
    .search input{width:100%;padding:12px;border-radius:24px;border:none;background:var(--muted)}
    .admin-label{color:var(--green);font-weight:700}
    .grid{display:grid;grid-template-columns:repeat(2,1fr);gap:18px;padding:18px}
    .card{display:flex;flex-direction:column;align-items:center;gap:8px;padding:12px;border-radius:8px;border:1px solid #f1f1f1;background:#fff}
    .card img{width:84px;height:84px;object-fit:cover;border-radius:6px}
    .card .label{color:var(--green);font-weight:600}
    .actions{display:flex;gap:8px;margin-top:6px}
    .icon-btn{width:36px;height:36px;border-radius:6px;border:none;display:inline-flex;align-items:center;justify-content:center;font-size:18px;color:#fff}
    .approve{background:var(--green)}
    .reject{background:#e53935}
    .status{display:flex;gap:6px;align-items:center;margin-top:6px}
    .status .ok{color:var(--green);font-weight:700}
    .status .no{color:#e53935;font-weight:700}
    .bottom-nav{position:fixed;left:0;right:0;bottom:0;height:56px;background:var(--green);display:flex;align-items:center;justify-content:space-around;color:#fff}
  </style>
</head>
<body>
  <div class="wrap" id="app">
    <!-- content injected by JS -->
  </div>

  <script>
    const apiBase = (location.hostname === 'localhost' || location.hostname === '127.0.0.1') ? 'http://127.0.0.1:5000' : window.location.origin;

    // Auth helpers: persist in localStorage if remember, otherwise sessionStorage
      // Auth helpers: persist admin marker in localStorage
      function saveAdmin(obj, remember){
        const data = obj || {};
        if(remember) localStorage.setItem('admin', JSON.stringify(data));
        else sessionStorage.setItem('admin', JSON.stringify(data));
      }
      function clearAdmin(){ localStorage.removeItem('admin'); sessionStorage.removeItem('admin'); }
      function getSavedAdmin(){
        const a = localStorage.getItem('admin') || sessionStorage.getItem('admin');
        if(!a) return null; try{ return JSON.parse(a) }catch(e){return null}
      }

      // Render login form (username/password)
      function renderLogin(message){
        const app = document.getElementById('app');
        app.innerHTML = `
          <div class="login-card">
            <h2>เข้าสู่ระบบผู้ดูแลระบบ</h2>
            <div class="notice">เฉพาะบัญชีผู้ดูแลระบบเท่านั้น (is_admin = 1). ผู้ใช้ทั่วไปที่สมัครใช้งานจะเข้าสู่ระบบนี้ไม่ได้</div>
            <input id="username" class="input" type="text" placeholder="ชื่อผู้ใช้งาน">
            <input id="password" class="input" type="password" placeholder="รหัสผ่าน">
            <label><input id="remember" type="checkbox"> จดจำบนเครื่องนี้</label>
            <div style="height:10px"></div>
            <div class="row"><button id="loginBtn" class="btn">เข้าสู่ระบบ</button> <button id="logoutBtn" class="btn" style="background:#888">ล้างข้อมูล</button></div>
            <div style="margin-top:10px;color:#666">${message?message:''}</div>
          </div>
        `;
        document.getElementById('loginBtn').addEventListener('click', async ()=>{
          const username = document.getElementById('username').value.trim();
          const password = document.getElementById('password').value;
          const remember = document.getElementById('remember').checked;
          if(!username || !password){ alert('กรุณาใส่ชื่อผู้ใช้และรหัสผ่าน'); return; }

          try{
            const resp = await fetch(apiBase + '/admin/login', {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({ username, password }),
              credentials: 'same-origin'
            });

            if(resp.status === 200){
              const data = await resp.json();
              // persist minimal admin marker
              saveAdmin({ id: data.id, username: data.username, is_admin: 1 }, remember);
              // redirect to admin main hub
              window.location.href = 'admin_main.html';
              return;
            }

            if(resp.status === 401 || resp.status === 403){
              renderLogin('ไม่สามารถเข้าสู่ระบบ: ชื่อผู้ใช้/รหัสผ่านไม่ถูกต้องหรือไม่มีสิทธิ์');
              return;
            }

            renderLogin('เกิดข้อผิดพลาด: ' + resp.status);
          }catch(err){
            console.error(err);
            renderLogin('เครือข่ายไม่พร้อมหรือ backend ไม่ทำงาน');
          }
        });
        document.getElementById('logoutBtn').addEventListener('click', ()=>{ clearAdmin(); alert('ข้อมูลถูกล้าง'); });
      }

    // Main admin UI
    const items = [
      {id:'class_food', label:'คลาสอาหาร', href:'admin_class_food.html'},
      {id:'menu_food', label:'เมนูอาหาร', href:'admin_menu_food.html'},
      {id:'personal', label:'กรอกข้อมูลส่วนบุคคล', href:'admin_member_information.html'},
      {id:'history', label:'ประวัติการกรอกข้อมูล', href:'admin_history_user.html'},
      {id:'report', label:'รายงานปัญหา', href:'admin_reports_user.html'}
    ];

    const stateKey = 'admin_states_v1';
    let states = JSON.parse(localStorage.getItem(stateKey) || '{}');
    function saveStates(){ localStorage.setItem(stateKey, JSON.stringify(states)); }

    function renderMain(offline){
      const app = document.getElementById('app');
      app.innerHTML = `
        <div class="top"><div class="admin-label">Admin</div><div class="search"><input id="q" placeholder="ค้นหา...."></div><div style="width:36px;text-align:right"><a id="logout" class="link">ออกจากระบบ</a></div></div>
        <div style="padding:8px;color:#666">${offline?'<strong>โหมดออฟไลน์:</strong> backend ไม่พร้อมใช้งาน — ใช้ข้อมูล local fallback':''}</div>
        <div class="grid" id="grid"></div>
        <div class="bottom-nav"><div>🏠</div><div>🔍</div><div>📋</div></div>
      `;
      document.getElementById('logout').addEventListener('click', ()=>{ clearAdmin(); location.reload(); });
      document.getElementById('q').addEventListener('input', renderGrid);
      renderGrid();
    }

    function renderGrid(){
      const grid = document.getElementById('grid'); grid.innerHTML = '';
      const q = document.getElementById('q').value.trim().toLowerCase();
      items.filter(it => !q || it.label.includes(q)).forEach(it => {
        const st = states[it.id] || {approved:false,rejected:false};
        const card = document.createElement('div'); card.className='card'; card.style.cursor='pointer';
        card.addEventListener('click', ()=>{ if(it.href) window.location.href = it.href; });
        const img = document.createElement('div'); img.style.width='84px'; img.style.height='84px'; img.style.borderRadius='6px'; img.style.background='#fafafa'; img.style.display='flex'; img.style.alignItems='center'; img.style.justifyContent='center'; img.textContent = '🍽️';
        const lbl = document.createElement('div'); lbl.className='label'; lbl.textContent = it.label;
        const actions = document.createElement('div'); actions.className='actions';
        const aBtn = document.createElement('button'); aBtn.className='icon-btn approve'; aBtn.title='อนุมัติ'; aBtn.innerHTML='✓';
        const rBtn = document.createElement('button'); rBtn.className='icon-btn reject'; rBtn.title='ปฏิเสธ'; rBtn.innerHTML='✕';
        aBtn.addEventListener('click', (ev)=>{ ev.stopPropagation(); states[it.id] = {approved:true,rejected:false}; saveStates(); renderGrid(); });
        rBtn.addEventListener('click', (ev)=>{ ev.stopPropagation(); states[it.id] = {approved:false,rejected:true}; saveStates(); renderGrid(); });
        actions.appendChild(aBtn); actions.appendChild(rBtn);
        const status = document.createElement('div'); status.className='status';
        if(st.approved){ const ok=document.createElement('div'); ok.className='ok'; ok.textContent='อนุมัติ'; status.appendChild(ok); }
        if(st.rejected){ const no=document.createElement('div'); no.className='no'; no.textContent='ปฏิเสธ'; status.appendChild(no); }
        card.appendChild(img); card.appendChild(lbl); card.appendChild(actions); card.appendChild(status);
        grid.appendChild(card);
      });
    }

    // Boot: check saved secret and validate
      // Boot: check saved admin marker and show appropriate screen
      (function(){
        const admin = getSavedAdmin();
        if(admin && admin.is_admin === 1){
          // assume backend session established or frontend-only admin marker
          renderMain(false);
        } else {
          renderLogin('');
        }
      })();
  </script>
</body>
</html>
