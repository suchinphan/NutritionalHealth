<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>เมนูอาหาร (Admin)</title>
  <style>
    :root{--green:#00C700;--muted:#f0f0f0}
    body{font-family:Arial,Helvetica,sans-serif;margin:0;background:#fff;color:#222}
    .top{display:flex;align-items:center;padding:12px 16px;border-bottom:1px solid #eee}
    .back{color:var(--green);text-decoration:none;font-weight:700;font-size:22px;margin-right:8px}
    .title{color:var(--green);font-weight:700;font-size:18px}
    .container{padding:18px}
    label{display:block;color:var(--green);font-weight:600;margin-top:10px}
    input, select, textarea{width:100%;padding:12px;border-radius:8px;border:none;background:var(--muted);box-sizing:border-box;margin-top:8px}
    .btn{margin-top:20px;background:var(--green);color:#fff;padding:12px;border:none;border-radius:6px;width:100%;font-weight:700}
  </style>
</head>
<body>
  <div class="top">
    <a href="admin.html" class="back">‹</a>
    <div class="title">เมนูอาหาร</div>
  </div>
  <div class="container">
    <label>เมนูอาหาร</label>
    <input id="menu_name" placeholder="เมนูอาหาร">

    <label>หมวดอาหาร</label>
    <input id="category" placeholder="โปรดระบุหมวดอาหาร">

    <label>ประเภทอาหาร</label>
    <input id="type" placeholder="โปรดระบุประเภทอาหาร">

    <label>ช่วงพลังงาน</label>
    <input id="energy" placeholder="โปรดระบุช่วงพลังงานและแคลอรี่">

    <label>ค้นหาเมนูอาหาร</label>
    <input id="search_menu" placeholder="ค้นหาเมนูอาหาร (ตัวอย่าง: ข้าวผัด)">

    <button class="btn" id="save">ตกลง</button>
  </div>

  <script>
    document.getElementById('save').addEventListener('click', ()=>{
      // เก็บชั่วคราวใน localStorage เป็นตัวอย่าง
      const data = {
        menu: document.getElementById('menu_name').value.trim(),
        category: document.getElementById('category').value.trim(),
        type: document.getElementById('type').value.trim(),
        energy: document.getElementById('energy').value.trim()
      };
      const key = 'admin_menu_entries';
      const arr = JSON.parse(localStorage.getItem(key) || '[]');
      arr.push(data);
      localStorage.setItem(key, JSON.stringify(arr));
      alert('บันทึกชั่วคราวแล้ว');
      window.location.href = 'admin.html';
    });
  </script>
</body>
</html>
