<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>เลือกประเภทอาหาร (Admin)</title>
  <style>
    :root{--green:#00C700;--muted:#f0f0f0}
    body{font-family:Arial,Helvetica,sans-serif;margin:0;background:#fff;color:#222}
    .top{display:flex;align-items:center;padding:12px 16px;border-bottom:1px solid #eee}
    .back{color:var(--green);text-decoration:none;font-weight:700;font-size:22px;margin-right:8px}
    .title{color:var(--green);font-weight:700;font-size:18px}
    .container{padding:16px}
    label{display:block;color:var(--green);font-weight:600;margin-top:10px}
    input, select{width:100%;padding:12px;border-radius:8px;border:none;background:var(--muted);box-sizing:border-box;margin-top:8px}
    .btn{margin-top:20px;background:var(--green);color:#fff;padding:12px;border:none;border-radius:6px;width:100%;font-weight:700}
  </style>
</head>
<body>
  <div class="top">
    <a href="admin.html" class="back">‹</a>
    <div class="title">เลือกประเภทอาหาร</div>
  </div>
  <div class="container">
    <label>เลือกประเภทอาหาร</label>
    <input id="food_type" placeholder="เช่น เมนูโปรตีน, เมนูคาร์บ">

    <label>ค้นหาเมนูอาหารตามหมวดหมู่</label>
    <input id="search_by_cat" placeholder="ค้นหาเมนูอาหารตามหมวดหมู่">

    <label>เมนูอาหาร (ตัวอย่าง)</label>
    <input id="menu_example" placeholder="ใส่ชื่อเมนู">

    <button class="btn" id="save">บันทึก</button>
  </div>
  <script>
    document.getElementById('save').addEventListener('click', ()=>{
      const data = {id:Date.now(), type:document.getElementById('food_type').value, search:document.getElementById('search_by_cat').value, menu:document.getElementById('menu_example').value };
      const key='select_type_entries'; const arr = JSON.parse(localStorage.getItem(key)||'[]'); arr.push(data); localStorage.setItem(key, JSON.stringify(arr));
      alert('บันทึกแล้ว (local)'); window.location.href='admin.html';
    });
  </script>
</body>
</html>
