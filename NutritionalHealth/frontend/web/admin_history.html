<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>ประวัติการกรอกข้อมูล (Admin)</title>
  <style>
    :root{--green:#00C700;--muted:#f6f6f6}
    body{font-family:Arial,Helvetica,sans-serif;margin:0;background:#fff;color:#222}
    .top{display:flex;align-items:center;padding:12px 16px;border-bottom:1px solid #eee}
    .back{color:var(--green);text-decoration:none;font-weight:700;font-size:22px;margin-right:8px}
    .title{color:var(--green);font-weight:700;font-size:18px}
    .container{padding:16px}
    .entry{padding:12px;border-radius:8px;border:1px solid #eee;margin-bottom:10px;background:#fafafa}
    .actions{display:flex;gap:8px;margin-top:8px}
    .btn{padding:8px 10px;border-radius:6px;border:none;background:var(--green);color:#fff}
    .btn.danger{background:#e53935}
  </style>
</head>
<body>
  <div class="top">
    <a href="admin.html" class="back">‹</a>
    <div class="title">ประวัติการกรอกข้อมูล</div>
  </div>
  <div class="container">
    <div id="list"></div>
  </div>
  <script>
    function render(){
      const arr = JSON.parse(localStorage.getItem('user_entries')||'[]');
      const list = document.getElementById('list'); list.innerHTML='';
      if(arr.length===0){ list.textContent='ยังไม่มีประวัติการกรอกข้อมูล'; return; }
      arr.slice().reverse().forEach((it)=>{
        const el = document.createElement('div'); el.className='entry';
        const h = document.createElement('div'); h.style.color='var(--green)'; h.style.fontWeight='700'; h.textContent = it.type ? ('['+it.type+']') : 'ข้อมูลผู้ใช้'; el.appendChild(h);
        const p = document.createElement('pre'); p.style.whiteSpace='pre-wrap'; p.textContent = JSON.stringify(it,null,2); el.appendChild(p);
        const actions = document.createElement('div'); actions.className='actions';
        const ok = document.createElement('button'); ok.className='btn'; ok.textContent='อนุมัติ';
        const no = document.createElement('button'); no.className='btn danger'; no.textContent='ปฏิเสธ';
        ok.addEventListener('click', ()=>{ alert('อนุมัติรายการนี้ (local)'); });
        no.addEventListener('click', ()=>{ if(!confirm('ปฏิเสธและลบรายการนี้?')) return; const idx = arr.findIndex(x=>x.id===it.id); if(idx>=0){ arr.splice(idx,1); localStorage.setItem('user_entries', JSON.stringify(arr)); render(); } });
        actions.appendChild(ok); actions.appendChild(no); el.appendChild(actions);
        list.appendChild(el);
      });
    }
    render();
  </script>
</body>
</html>
