<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>คำนวณ (Admin)</title>
  <style>
    :root{--green:#00C700;--muted:#f0f0f0}
    body{font-family:Arial,Helvetica,sans-serif;margin:0;background:#fff;color:#222}
    .top{display:flex;align-items:center;padding:12px 16px;border-bottom:1px solid #eee}
    .back{color:var(--green);text-decoration:none;font-weight:700;font-size:22px;margin-right:8px}
    .title{color:var(--green);font-weight:700;font-size:18px}
    .container{padding:16px}
    label{display:block;color:var(--green);font-weight:600;margin-top:10px}
    input, select{width:100%;padding:12px;border-radius:8px;border:none;background:var(--muted);box-sizing:border-box;margin-top:8px}
    .btn{margin-top:20px;background:var(--green);color:#fff;padding:12px;border:none;border-radius:6px;width:100%;font-weight:700}
    .result{margin-top:12px;padding:12px;border-radius:8px;background:#fafafa}
  </style>
</head>
<body>
  <div class="top">
    <a href="admin.html" class="back">‹</a>
    <div class="title">คำนวณ</div>
  </div>
  <div class="container">
    <label>เพศ</label>
    <select id="gender"><option value="male">ชาย</option><option value="female">หญิง</option></select>
    <label>อายุ</label>
    <input id="age" type="number" placeholder="ปี">
    <label>น้ำหนัก (กก.)</label>
    <input id="weight" type="number" placeholder="กิโลกรัม">
    <label>ส่วนสูง (ซม.)</label>
    <input id="height" type="number" placeholder="เซนติเมตร">
    <label>กิจกรรม (ตัวอย่าง)</label>
    <select id="activity"><option value="1.2">น้อย (1.2)</option><option value="1.375">เบา (1.375)</option><option value="1.55">ปานกลาง (1.55)</option><option value="1.725">มาก (1.725)</option></select>

    <button class="btn" id="calc">คำนวณ</button>
    <div id="result" class="result" style="display:none"></div>
  </div>

  <script>
    function calcBMR(gender, age, weight, height){
      // Mifflin-St Jeor
      const s = (gender==='male')?5:-161;
      return 10*weight + 6.25*height - 5*age + s;
    }

    document.getElementById('calc').addEventListener('click', ()=>{
      const gender=document.getElementById('gender').value;
      const age=Number(document.getElementById('age').value)||0;
      const weight=Number(document.getElementById('weight').value)||0;
      const height=Number(document.getElementById('height').value)||0;
      const act=Number(document.getElementById('activity').value)||1.2;
      if(!age||!weight||!height){ alert('กรุณากรอกข้อมูลให้ครบ'); return; }
      const bmr = calcBMR(gender,age,weight,height);
      const tdee = Math.round(bmr * act);
      document.getElementById('result').style.display='block';
      document.getElementById('result').textContent = 'BMR: ' + Math.round(bmr) + ' kcal/day\nประมาณแคลอรี่ที่ต้องการ: ' + tdee + ' kcal/day';
      // save to user_entries for history
      const key='user_entries'; const arr=JSON.parse(localStorage.getItem(key)||'[]'); arr.push({id:Date.now(), type:'calc', gender, age, weight, height, bmr:Math.round(bmr), tdee, created:new Date().toISOString()}); localStorage.setItem(key, JSON.stringify(arr));
    });
  </script>
</body>
</html>
