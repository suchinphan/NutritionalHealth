<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>เลือกประเภทอาหาร (Admin)</title>
  <style>
    :root{--green:#00C700;--muted:#f0f0f0}
    body{font-family:Arial,Helvetica,sans-serif;margin:0;background:#fff;color:#222}
    .top{display:flex;align-items:center;padding:12px 16px;border-bottom:1px solid #eee}
    .back{color:var(--green);text-decoration:none;font-weight:700;font-size:22px;margin-right:8px}
    .title{color:var(--green);font-weight:700;font-size:18px}
    .container{padding:16px}
    label{display:block;color:var(--green);font-weight:600;margin-top:10px}
    input, select{width:100%;padding:12px;border-radius:8px;border:none;background:var(--muted);box-sizing:border-box;margin-top:8px}
    .btn{margin-top:20px;background:var(--green);color:#fff;padding:12px;border:none;border-radius:6px;width:100%;font-weight:700}
  </style>
</head>
<body>
  <div class="top">
    <a href="admin_main.html" class="back">‹</a>
    <div class="title">จัดการประเภทอาหาร</div>
  </div>
  <div class="container">
    <div style="display:flex;align-items:center;justify-content:space-between">
      <div style="color:var(--green);font-weight:700">ตัวอย่างคลาสอาหาร</div>
      <div style="color:#666;font-size:13px">Admin</div>
    </div>

    <label>เลือกประเภทอาหาร</label>
    <select id="food_type" style="padding:12px;border-radius:8px;border:1px solid #eee;background:var(--muted)"></select>
    <div style="display:flex;align-items:center;gap:8px;margin-top:8px"><div style="color:var(--green);font-weight:600">✔</div><div style="color:#666">ตัวเลือกประเภทอาหาร</div></div>

    <label>ค้นหาเมนูอาหารตามหมวดหมู่</label>
    <select id="category" style="padding:12px;border-radius:8px;border:1px solid #eee;background:var(--muted)"></select>
    <div style="display:flex;align-items:center;gap:8px;margin-top:8px"><div style="color:var(--green);font-weight:600">✔</div><div style="color:#666">ค้นหาเมนูจากหมวดหมู่</div></div>

    <label>เมนูอาหาร</label>
    <input id="menu_example" placeholder="ดูข้อมูลเมนูอาหารที่ผู้ใช้เลือก">
    <div style="display:flex;align-items:center;gap:8px;margin-top:8px"><div style="color:var(--green);font-weight:600">✔</div><div style="color:#666">เมนูตัวอย่างแสดงผลได้</div></div>

    <div style="margin-top:18px;display:flex;gap:12px">
      <button class="btn" id="save">ตกลง</button>
      <button class="btn" id="cancel" style="background:#999">ยกเลิก</button>
    </div>
  </div>

  <script src="check-admin.js"></script>
  <script>
    const apiBase = (location.hostname === 'localhost' || location.hostname === '127.0.0.1') ? 'http://127.0.0.1:5000' : window.location.origin;

    async function loadFoodTypes(){
      try{
        const res = await fetch(apiBase + '/api/food-types');
        if(!res.ok) return [];
        return await res.json();
      }catch(e){ return []; }
    }

    async function loadCategories(food_type_id){
      try{
        const url = apiBase + '/api/food-categories' + (food_type_id?('?food_type_id='+food_type_id):'');
        const res = await fetch(url);
        if(!res.ok) return [];
        return await res.json();
      }catch(e){ return []; }
    }

    async function init(){
      const types = await loadFoodTypes();
      const ft = document.getElementById('food_type');
      ft.innerHTML = '<option value="">-- เลือกประเภทอาหาร --</option>' + types.map(t=>`<option value="${t.id}">${t.name}</option>`).join('');

      ft.addEventListener('change', async ()=>{
        const v = ft.value;
        const cats = await loadCategories(v);
        const sel = document.getElementById('category');
        sel.innerHTML = '<option value="">-- เลือกหมวดอาหาร --</option>' + cats.map(c=>`<option value="${c.id}">${c.name}</option>`).join('');
      });

      document.getElementById('cancel').addEventListener('click', ()=>{ window.location.href='admin_main.html'; });

      document.getElementById('save').addEventListener('click', ()=>{
        const data = { id: Date.now(), type_id: document.getElementById('food_type').value, category_id: document.getElementById('category').value, menu: document.getElementById('menu_example').value };
        const key='manage_food_categories'; const arr = JSON.parse(localStorage.getItem(key)||'[]'); arr.push(data); localStorage.setItem(key, JSON.stringify(arr));
        alert('บันทึกตัวอย่างแล้ว (local)'); window.location.href='admin_main.html';
      });
    }

    init();
  </script>
</body>
</html>
